# ============================================================
# 本地开发档（application.yml 默认激活本文件）
#
# 定位：只放「本地开发才需要」的增强项，且不掺 -dev 分支才有效的东西。
# 原则：这里每一项都必须能被环境变量覆盖，容器环境即使误激活也不会失控
#       （见 docker-compose.yml backend 的 LOG_LEVEL / SPRINGDOC_ENABLED / AI_LOG_PROMPT）。
#
# 中间件地址、账号、密钥等「连接类」配置不放这里，统一在 application.yml 里用
# ${环境变量:默认值} 声明，本地改 .env 或环境变量即可，避免两个文件互相打架。
# ============================================================

spring:
  ai:
    # 本地开发打印大模型请求/响应，便于排查 Advisor 链路
    chat:
      observations:
        log-completion: ${AI_LOG_PROMPT:true}
        log-prompt: ${AI_LOG_PROMPT:true}

# ==================== 接口文档 UI（本地开发档增强） ====================
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha
    persistAuthorization: true
  # 扫描范围必须覆盖所有放 @RestController 的包，否则对应接口不会出现在文档中
  packages-to-scan: com.lion.agent

# ==================== 日志（本地开 debug） ====================
logging:
  level:
    com.lion.agent: ${LOG_LEVEL:debug}
    # SimpleLoggerAdvisor 与 Advisor 链路的请求/响应日志
    org.springframework.ai.chat.client.advisor: ${AI_LOG_LEVEL:debug}
