# ============================================================
# Lion Agent 编排：中间件（MySQL / Redis / Milvus）+ 应用（backend / frontend）
#
# 用法：
#   docker compose up -d                       # 只起中间件（backend/frontend 属 app profile）
#   docker compose --profile app up -d --build # 中间件 + 应用一起构建启动
#   docker compose ps / logs -f backend / down [-v]
#
# 配置分工：
#   application.yml      公共配置（连接地址/密钥全部用环境变量，带默认值）
#   application-dev.yml  本地开发档（debug 日志、Swagger UI、AI 观测）
#   容器内默认仍会激活 dev，但下面 backend 已把这几项用环境变量关成「生产行为」，
#   想彻底不加载 dev 档则再加一行：SPRING_PROFILES_ACTIVE: default
#
# 敏感值来源：宿主机项目根目录的 .env
#   ① backend 用 env_file 全量注入容器（文件本身不进镜像，改密钥只需 recreate 容器）
#   ② mysql / redis 的 ${VAR:-默认} 由 Compose 自身的 dotenv 插值（同样读根目录 .env）
#   ③ 容器环境变量 > Spring import 的 .env 文件 > application*.yml 默认值
# 数据持久化在命名卷：mysql-data / redis-data / etcd-data / milvus-data / upload-data
# （minio 已移除，Milvus 改用容器内本地存储，见 milvus-standalone 的 COMMON_STORAGETYPE）
#
# 端口安全提示：3307(MySQL 宿主端口) / 6379 仅本地开发需要暴露；
# 上生产请删掉对应 ports，只保留 frontend 的 80（或反代后端 8080）。
# ============================================================

name: lion-agent

services:
  # ---------------- MySQL 8 ----------------
  mysql:
    image: mysql:8.0
    container_name: lion-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: lion_agent
      MYSQL_USER: ${DB_USERNAME:-xxkfz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xxkfz}
    ports:
      # 宿主 3307 -> 容器 3306：避免与本机已安装的 MySQL(3306) 冲突。
      # 容器内应用仍走服务名 + 内部端口：jdbc:mysql://mysql:3306/...
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次启动自动执行建库建表脚本（init.sql 内含 CREATE DATABASE / USE，幂等）
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- Redis ----------------
  redis:
    image: redis:7.4-alpine
    container_name: lion-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- etcd（Milvus 元数据存储，内部服务，不对外暴露） ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lion-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------- minio 已移除 ----------------
  # 原因：国内各镜像源均拉不到 minio/minio（阿里云加速器对该仓库 403）。
  # 方案：milvus-standalone 改用容器内本地磁盘存储（COMMON_STORAGETYPE=local），
  #       这是 Milvus 官方单机脚本 standalone_embed.sh 的标准跑法，单机开发完全够用。
  #       以后若能拉到 minio/S3 镜像，可恢复远端对象存储。

  # ---------------- Milvus standalone（向量数据库） ----------------
  milvus-standalone:
    # 必须与 Spring AI 的 milvus-sdk-java 大版本对齐（当前 SDK 2.6.x → 服务端 2.6.x），
    # 否则建索引报 "only metric type can be passed when using AutoIndex"
    image: milvusdb/milvus:v2.6.0
    container_name: lion-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 对象存储改用容器内本地磁盘（不再依赖 minio）；数据落在下方 milvus-data 卷
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    # 19530：gRPC 客户端端口（应用连接）；9091：健康检查与内部指标
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # ---------------- Attu：Milvus Web 管理台（可选） ----------------
  attu:
    image: zilliz/attu:latest
    container_name: lion-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: http://milvus-standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus-standalone:
        condition: service_healthy

  # ---------------- 后端应用（Spring Boot，镜像由根目录 Dockerfile 构建） ----------------
  backend:
    profiles: ["app"]
    image: lion-agent-backend:1.0.0
    container_name: lion-backend
    restart: unless-stopped
    # 镜像内不做编译：先本机 mvn -B clean package -DskipTests 打好 target/*.jar，再构建镜像
    build:
      context: .
      dockerfile: Dockerfile
    # 敏感/业务配置统一从宿主机项目根目录的 .env 注入为容器环境变量（全量注入，不用逐条列举）。
    # 注意：.env 只在此处被「注入」，不会被 COPY 进镜像（.dockerignore 已排除），改密钥无需重新 build。
    # 若部署机没有 .env，请复制 .env.example 填值；想让它「可选」可改写成 map 语法：
    #   env_file:
    #     - path: .env
    #       required: false   # 需 Docker Compose 2.24+
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # 以下为容器专属值，优先级高于 env_file，会覆盖 .env 里的 localhost 地址
      DB_URL: jdbc:mysql://mysql:3306/lion_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-xxkfz}
      DB_PASSWORD: ${DB_PASSWORD:-xxkfz}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      # 必须与 knowledge 写入侧一致（application.yml 两侧都读 MILVUS_COLLECTION）
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-lion_agent_knowledge}
      LION_UPLOAD_PATH: /app/upload/
      # 千问密钥等从项目根目录 .env 注入（未设置时为空，调模型会报鉴权失败）
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-max}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}
      QWEN_TEMPERATURE: ${QWEN_TEMPERATURE:-0.1}
      # Rerank 等专用接口默认回退 QWEN_API_KEY，这里显式透传便于分账号
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 关掉 dev 档的调试增强，容器行为对齐生产
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-warn}
      AI_LOG_PROMPT: ${AI_LOG_PROMPT:-false}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      # 与镜像内一致：端口探活，不依赖 curl/wget
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ---------------- 前端应用（Nginx 托管 dist，反代 /api 到 backend） ----------------
  frontend:
    profiles: ["app"]
    image: lion-agent-frontend:1.0.0
    container_name: lion-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      # 后端上游地址（容器内服务名）；单独部署时改成实际主机:端口
      BACKEND_UPSTREAM: backend:8080
    ports:
      # 宿主 80 -> 容器 80；若宿主 80 被占用改成 "8081:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  milvus-data:
  upload-data:
