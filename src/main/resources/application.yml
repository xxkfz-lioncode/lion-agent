# ============================================================
# Lion Agent 主配置（公共配置 + 全环境默认值）
#
# 配置文件分工：
#   application.yml      公共配置：框架行为、业务参数、中间件连接默认值（均可用环境变量覆盖）
#   application-dev.yml  本地开发档：调试日志、接口文档、AI 观测日志（默认激活）
#
# 覆盖优先级：系统环境变量 > .env 文件 > application-dev.yml > application.yml
# 本地开发：默认激活 dev，无需额外配置
# 服务器部署：dev 档里的每一项都能用环境变量关掉（见 docker-compose.yml 的 backend 服务）
# ============================================================

server:
  port: ${LION_AGENT_PORT:8080}

spring:
  application:
    name: lion-agent
  # 默认激活本地开发档；服务器部署时用环境变量 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 敏感配置统一从项目根目录的 .env 文件加载（KEY=VALUE 每行一个），
  # optional 前缀：文件不存在时不报错，仅使用下方默认值或系统环境变量。
  # 优先级：系统环境变量 > .env 文件 > yml 内的默认值。
  # 参考模板见 .env.example；.env 已被 gitignore，请勿提交真实密钥。
  config:
    import: optional:file:.env[.properties]

  # ==================== 数据源（MySQL 8） ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 容器内用服务名：DB_URL=jdbc:mysql://mysql:3306/lion_agent?...（见 docker-compose.yml）
    url: ${DB_URL:jdbc:mysql://localhost:3306/lion_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:xxkfz}
    password: ${DB_PASSWORD:xxkfz}

  # ==================== Redis：Redisson（读取 spring.data.redis 自动构建连接，连接池由 Redisson 自管） ====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:123456}
      timeout: 10s

  # 文件上传大小限制（超过则抛 MaxUploadSizeExceededException）
  servlet:
    multipart:
      # 单个文件最大 10MB（知识库文档/多模态图片）
      max-file-size: 10MB
      # 单次请求（多个文件合计）最大 20MB
      max-request-size: 20MB


# mcp相关配置
  ai:
    mcp:
      server:
        name: mcp-server
        version: 1.0.0
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        annotation-scanner:
          enabled: true
      client:
        enabled: true
        # 懒初始化：创建客户端时不立即连接远程 MCP Server。当第一次有请求真正需要用到这个 MCP 工具时，Client 才会去建立连接
        initialized: false
        toolcallback:
          enabled: true
        request-timeout: 120s
        # 静态 MCP 连接按协议分类（2.0 语法）：
        # - streamable-http：Streamable HTTP / Stateless 服务（默认端点 /mcp）
        # - sse：旧式 SSE 服务（默认端点 /sse），若对方只暴露 /mcp 仍配在 sse 下会 404
        # 注：若该服务已改由页面「MCP Server 管理」动态维护，可整段注释，避免启动时重复接入同一服务
        streamable-http:
          connections:
            # 对方 MCP Server 地址（Streamable HTTP），调用旅行规划
            travel-planner:
              url: http://localhost:8083
              endpoint: /mcp
#        sse:
#          connections:
            # 旧式 SSE 服务示例（仅对方只支持 SSE 时才用 sse 块）
#             graph-analysis:
#               url: http://localhost:8082


    chat:
      client:
        # ===== 工具搜索顾问（ToolSearchToolCallingAdvisor）=====
        tool-search-advisor:
          # 开启工具搜索顾问（对应 spring-ai-starter-tool-search-advisor）。
          # 开启后自动创建 ToolIndex（按下方 tool-index-type 选择实现）与 ToolSearchAdvisorProperties；
          # 注意：2.0.0 自动配置顺序问题导致它声明的 ToolSearch 版 Builder 会被 ChatClient 默认版顶掉，
          # 需配合 AiConfig#toolSearchToolCallingAdvisorBuilder 手动注册才会真正生效，
          # 因此关闭本开关会导致该 Bean 因缺少 ToolIndex/ToolSearchAdvisorProperties 启动失败。
          enabled: true
          # 工具索引类型（决定用哪种方式从工具库中检索候选工具）：
          #   regex   - 正则匹配（轻量，无需外部依赖）
          #   lucene  - 全文检索（本地 Lucene 索引）
          #   vector  - 向量检索（基于嵌入语义召回，需配置向量库，当前使用 Milvus）
          tool-index-type: vector
          # 单次会话初始化时最多向工具索引召回并注入上下文的任务数上限，
          # 用于控制“每次请求最多带几个候选工具”，避免工具过多撑大 prompt。
          max-results: 5
      # JDBC 会话记忆存储：自动建表（幂等，重启不会重复执行）
      memory:
        repository:
          jdbc:
            initialize-schema: always
      # 大模型请求/响应日志：默认关闭（避免生产日志落用户隐私内容）；本地开发档会打开
      observations:
        log-completion: ${AI_LOG_PROMPT:false}
        log-prompt: ${AI_LOG_PROMPT:false}

    # ===== TypeSafe（JEV 判断模型，spring-ai-starter-typesafe）=====
    # 用判断模型处理意图识别/分类路由/评分/护栏/重排，比通用大模型便宜且快。
    # 注意：TypeSafeClient Bean 仅在 api-key 有值时创建。
    typesafe:
      # ⚠️ api-key 刻意不写在这里：starter 对"属性存在但为空"的做法是【启动失败】，
      #    写成 ${TYPESAFE_API_KEY:} 而环境变量未设置就会直接起不来。
      #    正确做法：把 spring.ai.typesafe.api-key=xxx 写进 .env（见 .env.example）。
      #    不填则属性完全不存在 → 自动配置跳过 → 应用正常启动，仅该功能不可用。
      api-key: ${TYPESAFE_API_KEY}
      # 服务根地址（自部署/代理可覆盖）
      base-url: https://api.typesafe.ai
      # 默认模型：请求未显式指定 model 时使用
      model: jev-latest
      # 单次 HTTP 超时（不含重试）
      timeout: 10s
      # 重试预算（0.4.0+ 支持；0.2.0 若报未知属性可整段注释，未知属性默认忽略不影响启动）
      retry:
        max-retries: 2
        initial-backoff: 500ms
        max-backoff: 5s
        jitter: 0.25
        total-timeout: 30s

    # ==================== OpenAI 兼容接口（默认接入阿里云 DashScope 千问） ====================
    openai:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 千问 API Key：https://dashscope.console.aliyun.com/ 获取，通过环境变量或 .env 注入，禁止硬编码
      api-key: ${QWEN_API_KEY:}
      chat:
        model: ${QWEN_MODEL:qwen3.8-max}
        temperature: ${QWEN_TEMPERATURE:0.1}
      # 文本向量化模型（text-embedding-v3 输出 1024 维，需与下方 embedding-dimension 一致）
      # 注意：必须放在 spring.ai.openai.embedding 下，放错位置会回退到默认模型 text-embedding-ada-002
      embedding:
        model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}

    # ==================== 向量数据库：Milvus ====================
    # 注意：collection-name 必须与 lion.knowledge.collection-name 保持一致：
    # 写入侧（KnowledgeDocumentServiceImpl）读 lion.knowledge.*，检索侧（默认 VectorStore Bean）读这里，
    # 两处都取自同一个 MILVUS_COLLECTION 变量，避免「写入 A 集合、检索 B 集合」导致召回为空
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:19530}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:lion_agent_knowledge}
        embedding-dimension: 1024
        metric-type: COSINE
        index-type: AUTOINDEX
        # 2.x 默认 false，需显式开启以自动建库建集合
        initialize-schema: true


# ==================== MyBatis-Plus（公共） ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Sa-Token（公共） ====================
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（秒），默认 30 天
  timeout: 2592000
  # token 最低活跃频率（秒），-1 代表不限制，永不失效
  active-timeout: -1
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号时，是否共用一个 token
  is-share: false
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# ==================== 业务自定义配置 ====================
lion:
  # 输入侧敏感词拦截：词库由「敏感词管理」页面维护（存 ai_sensitive_word 表），改词即时生效、无需重启
  sensitive:
    # Advisor 顺序已固定为 -200（写在 AiConfig#SENSITIVE_WORD_ORDER）：比 Token 统计(-100)更外层，
    # 命中即短路，不消耗 token、不写会话记忆
    # 命中后返回给用户的拒绝话术
    reject-message: '您的问题包含敏感内容，我无法回答。'
    # 检测范围：user = 只检测本轮用户输入（默认，避免系统提示词/历史/知识库内容误杀）；all = 检测整个 prompt
    check-scope: user
  # 基于 Redis 的异步任务队列（生产者-消费者）
  async:
    # 每个队列的消费线程数
    consume-threads: 2
    # 任务处理失败后的最大重试次数（超过则标记失败，不再重投）
    max-retry: 3
  upload:
    # 文件上传存储路径，默认放在项目工作目录的 upload 文件夹下
    path: ${LION_UPLOAD_PATH:upload/}
    # 允许上传的文件类型（MIME）
    allowed-types: text/plain,text/markdown,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  # 文档切分策略参数（未配置的项走代码内默认值）
  splitter:
    page:
      # 按页切分（仅 PDF）：每块包含的页数，1 = 一页一块
      pages-per-document: 1
      # 页面上下边距（磅）：调大用于裁掉页眉/页脚，避免每页重复噪声进入向量
      top-margin: 0
      bottom-margin: 0

  # 知识库文档向量（RAG）：文档分片向量化后存入 Milvus，与语义缓存/工具索引/技能索引/记忆物理隔离
  knowledge:
    # 知识库专用 Milvus collection：必须与 spring.ai.vectorstore.milvus.collection-name 一致，
    # 两者都读 MILVUS_COLLECTION，保证写入与检索指向同一集合
    collection-name: ${MILVUS_COLLECTION:lion_agent_knowledge}
    # 向量维度，必须与 embedding 模型输出一致（text-embedding-v3 为 1024）
    embedding-dimension: 1024

  alapi:
    # ALAPI Token，用于调用星座运势等第三方接口；通过环境变量或 .env 注入，不填则星座运势工具返回配置缺失提示
    token: ${LION_ALAPI_TOKEN:}

  # 联网搜索（Tavily）：为 Agent 提供实时信息检索能力，见 WebSearchTools
  tavily:
    # Tavily API Key（tvly- 开头）；通过环境变量或 .env 注入，不填则联网搜索工具返回配置缺失提示
    api-key: ${TAVILY_API_KEY:}
    # 服务根地址，自建代理/网关可覆盖
    base-url: https://api.tavily.com
    # 检索深度：basic 1 额度/次、advanced 2 额度/次（advanced 更慢更贵，默认 basic）
    # 该参数不暴露给模型，避免模型随手选 advanced 导致成本翻倍
    search-depth: basic
    # 单次搜索默认返回条数（模型可在 1-20 内覆盖）
    max-results: 5
    # 是否附带 Tavily 生成的 AI 摘要；默认关闭，避免模型被"喂答案"而跳过原文比对
    include-answer: false
    # 网页正文抓取深度：basic 1 额度/5 个 URL、advanced 2 额度/5 个 URL
    extract-depth: basic
    # 连接超时：建连阶段，默认 5s
    connect-timeout: 5s
    # 请求超时：含服务端处理与响应读取，默认 20s（advanced 检索较慢，可上调到 30s）
    read-timeout: 20s

  dashscope:
    # DashScope（阿里云百炼）API Key，用于 Rerank 等专用模型接口
    # 默认优先读取 DASHSCOPE_API_KEY，未配置则回退到 QWEN_API_KEY（与千问大模型共享同一账号）
    api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
    rerank:
      # Rerank 模型名称，可选 qwen3-vl-rerank 等
      model: qwen3-vl-rerank
      # Rerank API 路径（baseUrl 固定为 https://dashscope.aliyuncs.com）
      url: /api/v1/services/rerank/text-rerank/text-rerank
  langfuse:
    # Langfuse 原生 Ingestion API 上报（可选能力，配合上方 OTel 链路使用）：
    # OTel 只覆盖链路内 Span，链路外的自定义事件/评分需直连摄取 API（参考 LangfuseIngestClient）
    # 未配置密钥时该工具类自动禁用，不影响主链路
    # Langfuse 服务根地址（官方云为 https://us.cloud.langfuse.com；自部署填 http://localhost:3000）
    base-url: ${LANGFUSE_BASE_URL:https://us.cloud.langfuse.com}
    # 项目密钥（Langfuse 控制台 Project Settings 可查）：public-key 与 secret-key 需成对配置，缺一即禁用上报
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    # 攒批上报参数：缓冲内事件数达到 batch-size，或距上次发送超过 flush-interval-ms 即发送一次
    batch-size: 20
    flush-interval-ms: 5000


  # 工具向量索引（RAG of Tools）：工具名+描述向量化，query 先按语义预筛 top-K 再走 function calling
  tool-index:
    # 工具索引专用 Milvus collection（与知识库 lion_agent_knowledge 物理隔离：
    # 启动/工具变更时按 type 清空重建，若与知识库同库会误清知识库/技能向量）
    collection-name: lion_agent_tool_index
    # 向量维度，必须与 embedding 模型输出一致（text-embedding-v3 为 1024）
    embedding-dimension: 1024

  # 自定义技能向量索引：技能名+描述向量化，query 按语义召回 + userId 标量过滤（用户间不串权限）
  # 默认与工具索引共用独立 collection lion_agent_tool_index，库内靠 type=skill_index 隔离；
  # 如后续规模增大需要拆库，可把 collection-name 改成独立的 lion_agent_skill_index。
  skill-index:
    collection-name: lion_agent_tool_index
    # 向量维度，必须与 embedding 模型输出一致（text-embedding-v3 为 1024）
    embedding-dimension: 1024

  # 语义缓存（方案 A）：重复问题直接复用历史回答（向量相似度命中），省 token 且秒回
  qa-cache:
    # 总开关；Milvus 不可用时自动降级，不影响正常对话
    enabled: false
    # 语义缓存专用 Milvus collection（与知识库 lion_agent_knowledge 物理隔离）
    collection-name: lion_agent_qa_cache
    # 向量维度，必须与 embedding 模型输出一致（text-embedding-v3 为 1024）
    embedding-dimension: 1024
    # 命中相似度阈值：text-embedding-v3 向量未归一化、短句相似度偏低（完全相同文本实测约 0.83），
    # 阈值设 0.75-0.80 较为合理；过高（如 0.94）会导致永远命中不了缓存
    threshold: 0.78
    # 每次检索取 Top-N 条候选（取最高相似度一条）
    top-k: 1
    # ---- 写入侧闸门：只有"同一个问题在任何时刻答案都基本一致"的问答才会进缓存 ----
    # 允许缓存的会话类型（chat=一般对话、kb=知识库问答）；留空或 all 表示不限制。
    # 默认只缓存 chat：知识库答案会随文档更新变化，需要缓存 kb 时自行加上
    cacheable-chat-types: chat
    # 问题含以下任意一个关键词即不缓存（时效 / 实时 / 易变数据）：
    # 「当前时间」「现在的天气」这类每次答案都不同，缓存只会让后续永远返回旧值
    deny-question-keywords: 当前时间,现在时间,现在几点,几点了,现在几号,今天几号,今天星期,星期几,周几,今天日期,当前日期,今天是,今天,今晚,明天,昨天,今年,本月,实时,此刻,当前,最新,最近,刚刚,天气,气温,温度,预报,下雨,台风,股价,汇率,油价,金价,余额,积分,库存,余量,剩余,倒计时,进度,在线人数,排队,新闻,热搜,热榜
    # 以这些词开头的问题依赖上文（代词 / 序数 / 承接），缓存后会张冠李戴，不缓存
    deny-reference-prefixes: 它,他,她,这,那,再,还,其,上面,下面,接着,继续,然后,另外,其他,还有,以及,第一个,第二个,第三个,前一个,后一个,上一个,下一个,最后一个
    # 出现在任意位置即说明依赖上文，不缓存
    deny-reference-keywords: 刚才,刚刚,上一句,上一条,上一个问题,前一个回答,前面说的,你刚才,上面说的,你上面,换个说法,再详细,详细点,具体点,展开说说,举个例子,继续说,还有吗
    # 回答含拒答 / 兜底话术时不缓存，避免"抱歉，我无法回答"被后续问题复用
    deny-answer-keywords: 抱歉,无法回答,不能回答,我不知道,我不清楚,我不确定,暂无相关信息,未找到,没有找到,找不到,稍后再试,请稍后,无法获取,暂时无法,未能获取
    # 回答中携带具体时刻（如 2026-08-23 10:33:06）说明答案天生带时效性，不缓存
    deny-answer-timestamp: true
    # 问题过短（"你好""在吗"）或过长（多半是渲染后的 KB prompt）不缓存；回答过短复用价值低，同样不缓存
    min-question-length: 4
    max-question-length: 500
    min-answer-length: 10

  # Advisor 调用链顺序已固定写死在 AiConfig 常量中（链路结构稳定，无需外部调整）：
  # SensitiveWord(-200) → TokenUsage(-100) → QaCache(10) → LongTermMemory(200) → ConversationSummary(300)
  # 敏感词拦截器的开关/话术/检测范围仍由下方 lion.sensitive.* 维护（顺序已写死为 -200）

  # 对话链路日志（ChatLoggerAdvisor，自定义替代官方 SimpleLoggerAdvisor）：
  # 按「请求 / 响应」两块结构化打印，一眼看清送进模型的 prompt 与最终回复
  advisor:
    logger:
      # 单条消息正文最多打印的字符数（系统提示词、知识库上下文动辄上千字，超出截断并标注总字数）
      max-content-length: 300

  # 系统提示词（模板集中维护在 PromptConfig，角色名由此处配置，渲染 {agentName} 变量）
  prompt:
    # Agent 角色名
    agent-name: Lion Agent

  # 多模态对话专用模型（MultimodalChatView 图片+文本对话）
  # 复用 spring.ai.openai 的端点与密钥（DashScope OpenAI 兼容接口），仅切换模型名
  multimodal:
    # 视觉语言模型，可选 qwen-vl-max / qwen-vl-plus / qwen3-vl-plus 等
    model: ${LION_MULTIMODAL_MODEL:qwen-vl-max}
    # 采样温度
    temperature: 0.1

  # Token 用量落库异步线程池（TokenUsageAdvisor 统计写入与主调用链路解耦，不阻塞响应）
  token-usage:
    executor:
      # 核心线程数
      core-pool-size: 2
      # 最大线程数
      max-pool-size: 8
      # 队列容量（队列满时由调用线程同步兜底落库，保证统计不丢失）
      queue-capacity: 1024
      # 非核心线程空闲回收时间（秒）
      keep-alive-seconds: 60
      # 线程名前缀（便于日志定位）
      thread-name-prefix: token-usage-

  # ==================== 长期记忆（跨会话） ====================
  # 方案：对话/知识库问答完成后，异步 LLM 抽取用户事实/偏好 → MySQL ai_memory 存原文 + Milvus
  # collection lion_agent_memory 存向量 → LongTermMemoryAdvisor 每次调用前检索注入。
  memory:
    # 总开关；Milvus 不可用时自动降级，不影响正常对话
    enabled: true
    # 是否启用 LLM 抽取（仅影响写入，读取注入不受影响）
    extract-enabled: true
    # 长期记忆专用 Milvus collection（与知识库/语义缓存物理隔离）
    collection-name: lion_agent_memory
    # 向量维度，必须与 embedding 模型输出一致（text-embedding-v3 为 1024）
    embedding-dimension: 1024
    # 写入去重策略：不依赖向量相似度，直接按 userId 强制合并为一条用户画像（每个用户最多一条）
    # 读取注入相似度阈值：低于该值的记忆不注入（避免无关记忆干扰回答）。短文本记忆建议 0.50-0.60
    search-threshold: 0.55
    # 检索条数（Advisor 调用 search 未指定 topK 时使用）
    search-top-k: 5
    # 每次调用注入到 prompt 的记忆条数（AiConfig 中 LongTermMemoryAdvisor 使用）
    inject-top-k: 5
    # 长期记忆抽取/落库异步线程池（与主调用链路解耦，不阻塞响应）
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 512
      keep-alive-seconds: 60
      thread-name-prefix: memory-


# ---------- Actuator 监控与 OpenTelemetry 可观测性 ----------
management:
  endpoints:
    web:
      exposure:
        # 暴露全部 Actuator 端点（/actuator/health、/actuator/metrics 等），便于本地排查；生产建议收敛为 health,info
        include: "*"
  endpoint:
    health:
      # 健康检查始终返回明细（含各组件连接状态），方便确认 MySQL/Redis 等是否就绪
      show-details: always
  tracing:
    sampling:
      # 链路采样率：1.0 = 100% 全量采样（Langfuse 排障期建议全量，量大后可降为 0.1）
      probability: 1.0
  # ===== OpenTelemetry OTLP 链路导出（Spring Boot 4 专属写法）=====
  # 注意：SB3 时代的 management.otlp.tracing.* 前缀在 SB4 已失效，必须迁移到 management.opentelemetry.tracing.export.otlp.*
  # 依赖：pom.xml 中的 spring-boot-starter-opentelemetry，自动装配 OTLP Span Exporter，把链路数据上报到 Langfuse
  opentelemetry:
    tracing:
      export:
        otlp:
          # Langfuse Cloud (US) OTLP 端点。路径必须带 /api/public/otel 前缀，缺了会 404；
          # 可通过 LANGFUSE_OTLP_ENDPOINT 环境变量覆盖，未设置时默认指向 Langfuse US 云服务
          endpoint: ${LANGFUSE_OTLP_ENDPOINT:https://us.cloud.langfuse.com/api/public/otel/v1/traces}
          headers:
            # Langfuse OTLP 端点认证方式为 Basic Auth，值为 base64("pk-lf-xxx:sk-lf-xxx")。
            # 兼容两种环境变量名：LANGFUSE_AUTH_BASIC（旧写法）与 LANGFUSE_OTLP_AUTH（.env.example / README 使用）；
            # 注意：两者都未设置时这里取到空串 → Langfuse 会拒绝并返回 401（历史排查过的问题点，勿删嵌套兜底）
            Authorization: "${LANGFUSE_AUTH_BASIC:${LANGFUSE_OTLP_AUTH:}}"
            # Langfuse v4 实时摄取：必须携带，否则 OTel 数据可能延迟最长 10 分钟才入库
            x-langfuse-ingestion-version: "4"
  # 关闭 Micrometer OTLP metrics 上报：
  # spring-boot-starter-opentelemetry 会自动激活 OtlpMeterRegistry，默认上报到本机 localhost:4318 的
  # OpenTelemetry Collector；本机未部署 Collector 时会持续刷 Connection refused 日志，
  # 且 metrics 数据对 Langfuse 无意义，故显式禁用（只保留 tracing）
  otlp:
    metrics:
      export:
        enabled: false



# ==================== Resilience4j 熔断器 + 限时器 ====================
# 作用：保护应用不被外部依赖（大模型、第三方 API、数据库等）的故障级联拖垮。
# 依赖：resilience4j-spring-boot4 + aspectjweaver（@CircuitBreaker / @TimeLimiter 注解由 AOP 切面拦截生效）
resilience4j:
  circuitbreaker:
    # 熔断器状态机：CLOSED（关闭，正常放行）→ OPEN（打开，直接拒绝并走 fallback）→ HALF_OPEN（半开，试探放行）
    instances:
      # ==================== aiService：大模型对话（ChatServiceImpl.stream） ====================
      aiService:
        sliding-window-type: COUNT_BASED          # 滑窗类型：COUNT_BASED 按调用次数统计（另有 TIME_BASED 按时间窗口统计）
        sliding-window-size: 10                   # 滑动窗口大小：统计最近 10 次调用
        minimum-number-of-calls: 5                # 最少 5 次调用后才开始计算失败率（防止低流量下偶发失败误触发熔断）
        failure-rate-threshold: 50                # 失败率阈值：最近窗口内失败率 > 50% 时触发熔断（CLOSED → OPEN）
        wait-duration-in-open-state: 60s          # 熔断器 OPEN 状态持续时间：60 秒后自动转入 HALF_OPEN 尝试恢复
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求，全部成功则恢复 CLOSED，否则重新 OPEN
        record-exceptions:                        # 记录哪些异常算作失败（只有列表内的异常才会计入失败率，其他异常被忽略）
          - org.springframework.web.reactive.function.client.WebClientResponseException # WebClient 调用远端返回 4xx/5xx
          - java.net.ConnectException              # 连接被拒绝（远端不可达）
          - java.util.concurrent.TimeoutException  # 调用超时
          - com.lion.agent.common.exception.BusinessException # 统一业务包装异常，必须计入，否则业务错误码场景熔断无法触发
      # ==================== queryStarFortune：星座运势工具（StarFortuneTools.queryStarFortune，调 ALAPI） ====================
      queryStarFortune:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 2                # 外部接口流量小，2 次失败即可开始评估（便于快速熔断）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 记录哪些异常算作失败
          - com.lion.agent.common.exception.BusinessException # ALAPI 调用异常、业务错误码均包装为该异常计入失败
      # ==================== webSearch：联网搜索工具（WebSearchTools.webSearch / webExtract，调 Tavily） ====================
      webSearch:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 2                # 外部接口流量小，2 次失败即可开始评估（便于快速熔断）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 记录哪些异常算作失败
          # 网络异常/超时/非 2xx 在 WebSearchTools 内统一包装为该异常计入失败率；
          # API Key 未配置属运维问题，工具直接返回提示文案而不抛异常，不计入失败率
          - com.lion.agent.common.exception.BusinessException
      # ==================== userTools：用户查询工具（UserTools.getUserCount / getUserStatusSummary，查 MySQL） ====================
      userTools:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 5                # 至少 5 次调用后才开始计算失败率（防止低流量误触发）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 记录哪些异常算作失败（本地 DB 查询，主要兜底数据库不可用等场景）
          - com.lion.agent.common.exception.BusinessException
      # ==================== dateTools：时间查询工具（DateTools.getNowDate，纯本地计算） ====================
      dateTools:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 5                # 至少 5 次调用后才开始计算失败率（防止低流量误触发）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 记录哪些异常算作失败
          - com.lion.agent.common.exception.BusinessException
      # ==================== dashScopeRerank：DashScope Rerank API（DashScopeRerankUtils.rerank，外部 HTTP 调用） ====================
      dashScopeRerank:
        sliding-window-type: COUNT_BASED          # 基于调用次数的滑动窗口
        sliding-window-size: 10                   # 统计最近 10 次调用
        minimum-number-of-calls: 5                # 至少 5 次调用后才开始计算失败率（防止低流量误触发）
        failure-rate-threshold: 50                # 失败率超过 50% 时触发熔断
        wait-duration-in-open-state: 60s          # 熔断器打开后，等待 60 秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态下允许 3 个试探请求
        record-exceptions:                        # 记录哪些异常算作失败（外部 HTTP 调用常见异常必须计入）
          - org.springframework.web.client.ResourceAccessException    # 连接/IO 异常（远端不可达、网络抖动）
          - org.springframework.web.client.RestClientResponseException  # HTTP 4xx/5xx
          - java.util.concurrent.TimeoutException                       # 调用超时
          - com.lion.agent.common.exception.BusinessException                # 业务包装异常（响应解析失败、业务错误）

  # ==================== 限时器（TimeLimiter）：与 @TimeLimiter 注解配套 ====================
  # 注意：@TimeLimiter 要求方法返回 CompletableFuture，与 SseEmitter 不兼容，
  #       ChatServiceImpl.stream() 已移除该注解；当前由 TimeLimiterTools.slowTask 演示使用。
  timelimiter:
    instances:
      aiService: # 预留：ChatServiceImpl 曾使用，现已移除注解，未实际生效
        timeout-duration: 30s         # 30 秒未响应直接超时
        cancel-running-future: true   # 超时后自动取消正在运行的底层任务（避免线程泄漏）
      slowTask: # @TimeLimiter 演示实例（TimeLimiterTools.runSlowTask）
        timeout-duration: 3s          # 超过 3 秒未完成即判定超时，触发降级
        cancel-running-future: true   # 超时后取消底层任务，避免线程泄漏

dify:
  # Dify 服务地址（只要协议+IP+端口，不要带路径，也不要带尾斜杠）
  # 非敏感项，保留默认值；如需覆盖可用 DIFY_URL 环境变量
  url: ${DIFY_URL:http://127.0.0.1}
  server:
    # 控制台账号邮箱：用于调用 Server API（应用列表、画布、应用详情等 console 接口）
    # 流程是「拿邮箱+密码去 /console/api/login 换令牌」，而不是 personal access token
    # 敏感项：从环境变量 / .env 的 DIFY_SERVER_EMAIL 注入
    email: ${DIFY_SERVER_EMAIL:}
    # 控制台账号密码（敏感项：DIFY_SERVER_PASSWORD）
    password: ${DIFY_SERVER_PASSWORD:}
  dataset:
    # 知识库 API Key：调用 Dataset API（/v1/datasets 等）的鉴权凭证，格式 dataset-xxx
    # 获取方式：Dify 控制台 → 知识库 → 右上角「API」→「API 密钥」（只能在新建时复制一次）
    # 敏感项：从环境变量 / .env 的 DIFY_DATASET_API_KEY 注入
    # 留空会自动走 Server API 获取；但 Dify 的密钥列表接口返回脱敏值，建议务必填真实 Key
    api-key: ${DIFY_DATASET_API_KEY:}
  client-config:
    # 是否打印 SDK 的请求日志（含请求头与响应），排错时打开，生产环境建议关闭
    logging: true

# ==================== SpringDoc 接口文档（开关） ====================
# 生产环境设 SPRINGDOC_ENABLED=false 关闭；UI 排序与包扫描见 application-dev.yml
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

knife4j:
  enable: ${SPRINGDOC_ENABLED:true}

# ==================== 日志 ====================
# 本地开发档默认 debug；这里给的是「未激活 dev」时的级别，同样可用环境变量调整
logging:
  level:
    com.lion.agent: ${LOG_LEVEL:info}
    org.springframework.ai.chat.client.advisor: ${AI_LOG_LEVEL:warn}
