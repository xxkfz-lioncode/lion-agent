# ==================== 生产环境 ====================
server:
  port: 8080

spring:
  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lion_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ==================== Spring AI：接入千问（DashScope OpenAI 兼容接口） ====================
  ai:
    openai:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 生产环境必须通过环境变量注入，禁止硬编码
      api-key: ${QWEN_API_KEY}
      chat:
        model: ${QWEN_MODEL:qwen3.8-max}
        temperature: 0.7
      # 文本向量化模型（DashScope text-embedding-v3 默认输出 1024 维，需与 Milvus embedding-dimension 一致）
      embedding:
        model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}

    # ==================== 向量数据库：Milvus ====================
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:lion_agent_knowledge}
        embedding-dimension: 1024
        metric-type: COSINE
        index-type: AUTOINDEX
        initialize-schema: true

# ==================== SpringDoc + Knife4j（生产关闭） ====================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

logging:
  level:
    com.lion.agent: info
